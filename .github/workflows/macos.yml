---
name: macos
permissions:
  contents: read

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  perl:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
      - name: perl -V
        run: perl -V
      - name: Install dependencies
        run: |
          brew install cpanminus libmaxminddb
          cpanm --quiet --notest --installdeps .
      - name: Run tests
        run: |
          perl Makefile.PL
          make test
